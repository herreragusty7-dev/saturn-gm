kind = "web"
previewPath = "/"
title = "Saturn GM — Tienda Streetwear"
version = "1.0.0"
id = "artifacts/saturn-gm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25974

[services.development]
run = "pnpm --filter @workspace/saturn-gm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saturn-gm", "run", "build" ]
serve = "static"
publicDir = "artifacts/saturn-gm/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25974"
BASE_PATH = "/"
